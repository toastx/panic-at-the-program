[package]
name = "patp"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "panic"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
curve25519-dalek = "5.0.0"
flate2 = "1.1.10"
# unstable-rendered-line-info: Paragraph::line_count, to size the diagnosis
# panel by the rows it occupies once wrapped rather than by its line count.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["json"] }
